limit_req_zone $binary_remote_addr zone=ymll_admin_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name yanmengli.cn www.yanmengli.cn;

    location /.well-known/acme-challenge/ { root /var/www/yanmengli/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yanmengli.cn www.yanmengli.cn;

    root /var/www/yanmengli/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/yanmengli.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yanmengli.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/ymllblog-security.conf;

    location = /admin-api/login {
        limit_req zone=ymll_admin_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /admin-api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 7m;
    }

    location ^~ /admin/ {
        include /etc/nginx/snippets/ymllblog-security.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /ymllblog/ { rewrite ^/ymllblog/(.*)$ /$1 permanent; }
    location ~ /\. { deny all; }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        try_files $uri =404;
    }

    location ~* /(sitemap\.xml|rss\.xml|robots\.txt)$ {
        expires 1h;
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json application/xml image/svg+xml;

    location / { try_files $uri $uri/ =404; }
}
