name: CI — test, lint, build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tests/home-layout.test.mjs
      - run: node tests/runtime-safety.test.mjs
      - run: npx astro check

  build:
    name: Build (sitemap + dist)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify sitemap exists
        run: test -f dist/sitemap.xml
      - name: Verify RSS exists
        run: test -f dist/rss.xml
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  link-check:
    name: Lychee link check
    runs-on: ubuntu-latest
    continue-on-error: true   # link-check is advisory; many false positives on Chinese sites (429)
    steps:
      - uses: actions/checkout@v4
      - name: Build first (links depend on built URLs)
        run: npm ci && npm run build
      - name: Run lychee against built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --timeout 20
            --root-dir ./dist
            --accept 200,203,206,301,302,303,304,307,308,429
            ./dist/**/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            src/content/blog/**/*.md
            README.md
            CONTRIBUTING.md
          config: .markdownlint.jsonc
