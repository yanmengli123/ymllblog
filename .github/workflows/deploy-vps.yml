name: Deploy to VPS

# 自动部署到 https://yanmengli.cn
# - push 到 main → 部署生产
# - PR 打开 → 部署预览分支（独立目录，不影响生产）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 防止并发部署（同一时间只能跑一个 deploy job）
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Contract tests
        run: |
          node tests/home-layout.test.mjs
          node tests/runtime-safety.test.mjs

      - name: Type check
        run: npx astro check

      - name: Build
        env:
          # CF Pages 和 VPS 都用同一份环境变量配置，保证两边构建产物一致
          BASE_URL: /
          SITEMAP_SITE_ROOT: https://yanmengli.cn
          CI: true
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/sitemap.xml
          test -f dist/rss.xml
          test -d dist/_astro
          echo "Build artifacts OK"

      - name: Upload artifact (retained 7 days for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy-production:
    name: Deploy to VPS (production)
    # 只在 push 到 main 时部署（PR 走 preview-deploy，不走这条）
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://yanmengli.cn

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "Key first line: $(head -1 ~/.ssh/deploy_key)"
          echo "Key last line: $(tail -1 ~/.ssh/deploy_key)"
          # Disable host key checking - VPS IP may have changed
          echo "StrictHostKeyChecking=no" >> ~/.ssh/config
          echo "UserKnownHostsFile=/dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test SSH connectivity
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o ConnectTimeout=15 \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "echo 'GITHUB ACTIONS SSH OK' && uname -a"

      - name: Install rsync and deploy
        run: |
          sudo apt-get update -qq && sudo apt-get install -y rsync
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/yanmengli/html/
          echo "✅ rsync complete"

      - name: Verify deployment
        run: |
          sleep 3
          echo "Verifying https://yanmengli.cn is live..."
          curl -sI https://yanmengli.cn | head -1 || exit 1
          echo "✅ Production deploy verified"

      - name: Notify success
        if: success()
        run: |
          echo "🎉 Production deployed: https://yanmengli.cn"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Production deploy FAILED"
          echo "Commit: ${{ github.sha }}"
          echo "Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  deploy-preview:
    name: Deploy PR preview
    # 只在 PR 时跑，部署到独立子目录（不影响生产）
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: preview-${{ github.event.pull_request.number }}

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: rsync to preview subdirectory
        run: |
          sudo apt-get update -qq && sudo apt-get install -y rsync
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/yanmengli/preview-${{ github.event.pull_request.number }}/

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🌐 Preview: https://preview-${{ github.event.pull_request.number }}.yanmengli.cn
            _(该域名需要在 Cloudflare / DNS 中配置 wildcard，前缀指向 VPS — 见 docs/DEPLOY-AUTOMATION.md)_